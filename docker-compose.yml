# The official PHP images ship with the sqlite3 and mbstring extensions.
x-php: &php
  volumes:
    - .:/app
  working_dir: /app
  command: tail -f /dev/null

services:
  php-8.3:
    <<: *php
    image: php:8.3-cli-alpine

  php-8.4:
    <<: *php
    image: php:8.4-cli-alpine

  php-8.5:
    <<: *php
    image: php:8.5-cli-alpine
